<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicart - Secure Access Portal</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        };
        function initTheme() {
            const theme = localStorage.getItem('theme') || 'system';
            applyTheme(theme);
        }
        function applyTheme(theme) {
            const root = document.documentElement;
            let isDark = false;
            if (theme === 'system') {
                isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            } else {
                isDark = theme === 'dark';
            }
            if (isDark) {
                root.classList.add('dark');
            } else {
                root.classList.remove('dark');
            }
        }
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            if (localStorage.getItem('theme') === 'system' || !localStorage.getItem('theme')) {
                applyTheme('system');
            }
        });
        initTheme();
    </script>
    <style>
        body {
            font-family: "Plus Jakarta Sans", sans-serif;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 10px 30px -5px rgba(148, 163, 184, 0.15), 0 4px 12px -2px rgba(148, 163, 184, 0.08);
            transition: background-color 300ms, border-color 300ms, box-shadow 300ms;
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }
        .glow-cyan {
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.08);
            border-color: rgba(6, 182, 212, 0.2);
        }
        .dark .glow-cyan {
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.15);
            border-color: rgba(6, 182, 212, 0.25);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-100 via-sky-50 to-blue-100/70 text-slate-800 dark:from-[#020617] dark:via-[#090d22] dark:to-[#020617] dark:text-slate-100 min-h-screen flex items-center justify-center p-6 relative overflow-hidden transition-all duration-500">

    <!-- Decorative background blobs -->
    <div class="absolute top-[-20%] left-[-10%] w-[500px] h-[500px] bg-blue-500/10 dark:bg-blue-500/5 rounded-full blur-[130px] pointer-events-none"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[500px] h-[500px] bg-emerald-500/10 dark:bg-emerald-500/5 rounded-full blur-[130px] pointer-events-none"></div>

    <div class="glass-panel p-8 rounded-3xl w-full max-w-md relative overflow-hidden z-10 glow-cyan">
        <div class="absolute -top-px left-10 right-10 h-px bg-gradient-to-r from-transparent via-cyan-400/50 to-transparent"></div>
        
        <div class="text-center mb-8">
            <div class="inline-flex h-12 w-12 rounded-2xl bg-gradient-to-tr from-blue-500 to-cyan-400 items-center justify-center shadow-lg shadow-blue-500/20 mb-4">
                <span class="text-2xl">🧬</span>
            </div>
            <h2 class="text-2xl font-black bg-gradient-to-r from-blue-600 to-cyan-600 dark:from-blue-400 dark:to-cyan-400 bg-clip-text text-transparent">Medicart Hub</h2>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 font-semibold uppercase tracking-wider">Secure Operator Authentication</p>
        </div>

        <div id="error" class="hidden bg-rose-500/10 border border-rose-500/20 text-rose-600 dark:text-rose-400 p-3 rounded-xl mb-4 text-xs font-semibold font-mono"></div>
        
        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-slate-600 dark:text-slate-300 text-xs font-bold uppercase tracking-wider mb-2">Email Address</label>
                <input type="email" id="email" class="w-full px-4 py-2.5 bg-white dark:bg-slate-950/40 border border-slate-200 dark:border-white/5 rounded-xl text-slate-800 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-cyan-500/50 focus:ring-4 focus:ring-cyan-500/10 transition-all font-medium" placeholder="e.g. admin@medicart.com" required>
            </div>
            <div class="mb-2">
                <label class="block text-slate-600 dark:text-slate-300 text-xs font-bold uppercase tracking-wider mb-2">Password</label>
                <input type="password" id="password" class="w-full px-4 py-2.5 bg-white dark:bg-slate-950/40 border border-slate-200 dark:border-white/5 rounded-xl text-slate-800 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-cyan-500/50 focus:ring-4 focus:ring-cyan-500/10 transition-all font-medium" placeholder="••••••••" required>
            </div>
            <button type="submit" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-blue-500 to-cyan-500 hover:from-blue-600 hover:to-cyan-600 text-white font-extrabold text-sm shadow-lg shadow-blue-500/25 hover:shadow-cyan-500/25 hover:scale-[1.02] active:scale-[0.98] transition-all duration-300 uppercase tracking-widest mt-6">Authorize Portal</button>
        </form>
        <p class="mt-6 text-center text-xs font-semibold text-slate-500 dark:text-slate-400">Don't have an operator profile? <a href="register.html" class="text-cyan-600 dark:text-cyan-400 hover:underline">Register account</a></p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('role', data.role);
                    if (data.role === 'admin') window.location.href = 'admin.html';
                    else if (data.role === 'cashier') window.location.href = 'cashier.html';
                    else window.location.href = 'customer.html';
                } else {
                    errorDiv.textContent = data.error;
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.textContent = 'Server error. Try again later.';
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
